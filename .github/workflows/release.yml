name: Build and Release RustInk Installers

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  release:
    name: Build and Upload Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-librsvg

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libwayland-dev \
            libxkbcommon-dev libfontconfig1-dev libpoppler-glib-dev

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install gtk+3 poppler pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and Package Windows Installer
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
        run: |
          cargo build --release --target ${{ matrix.target }}

          rm -rf dist
          mkdir -p dist/lib
          mkdir -p dist/share/glib-2.0
          mkdir -p dist/share/icons
          mkdir -p dist/icons

          cp target/${{ matrix.target }}/release/rustInk.exe dist/
          cp -r src/ui/icons/* dist/icons/

          ldd dist/rustInk.exe | grep -i 'ucrt64' | awk '{print $3}' | xargs -r -I '{}' cp -u '{}' dist/

          cp -r /ucrt64/lib/gdk-pixbuf-2.0 dist/lib/
          find /ucrt64/lib/gdk-pixbuf-2.0 -name "*.dll" -exec ldd {} + 2>/dev/null | grep -i 'ucrt64' | awk '{print $3}' | sort -u | xargs -r -I '{}' cp -u '{}' dist/

          cp -r /ucrt64/share/glib-2.0/schemas dist/share/glib-2.0/
          cp -r /ucrt64/share/icons/hicolor dist/share/icons/
          cp -r /ucrt64/share/icons/Adwaita dist/share/icons/

      - name: Compile Windows Installer (.exe)
        if: runner.os == 'Windows'
        shell: cmd
        run: iscc installer.iss

      - name: Build Linux Installer (.deb)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb
          cargo deb
          
      - name: Build macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle
          cargo bundle --release
          hdiutil create -volname RustInk -srcfolder target/release/bundle/osx/RustInk.app -ov -format UDZO RustInk-macOS-arm64.dmg

      - name: Upload Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/RustInk-Setup.exe
            target/debian/*.deb
            *.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}