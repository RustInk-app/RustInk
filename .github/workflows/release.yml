name: Build and Release RustInk

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Upload Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rustink-windows.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: rustink-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rustink-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies (GUI & Audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libwayland-dev \
            libxkbcommon-dev libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv rustink.exe ${{ matrix.artifact_name }}
          else
            mv rustink ${{ matrix.artifact_name }}
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}