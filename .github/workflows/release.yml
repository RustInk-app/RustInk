name: Build and Release RustInk

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  release:
    name: Build and Upload Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact_name: rustInk-windows.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: rustInk-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rustInk-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-poppler

      
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libwayland-dev \
            libxkbcommon-dev libfontconfig1-dev libpoppler-glib-dev

      
      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install gtk+3 poppler pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      
      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cargo build --release --target ${{ matrix.target }}

      
      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv rustInk.exe ${{ matrix.artifact_name }}
          else
            mv rustInk ${{ matrix.artifact_name }}
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}